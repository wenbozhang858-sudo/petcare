<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PET CARE</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#eef6f7;--ink:#12353b;--muted:#4d6c71;--card:#fff;--accent:#ffc83d;--teal:#1f7a85;--line:#cfe3e6;--warn:#fff4cf;--warnink:#5b4500;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2226;--ink:#e6f3f4;--muted:#9bbcc0;--card:#16333a;--teal:#5fc4d0;--line:#25474f;--warn:#3a3213;--warnink:#f3dc8a}}
:root[data-theme="dark"]{--bg:#0e2226;--ink:#e6f3f4;--muted:#9bbcc0;--card:#16333a;--teal:#5fc4d0;--line:#25474f;--warn:#3a3213;--warnink:#f3dc8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 -apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 48px}
h1{font-size:clamp(2.8rem,14vw,5rem);line-height:1;margin:48px 0 8px;font-weight:900;letter-spacing:.04em;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 32px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:24px;padding:28px 12px;text-align:center;transition:background .2s,border-color .2s,transform .2s}
.opt .e{display:block;font-size:3.4rem;line-height:1.2}
.opt b{display:block;font-size:1.4rem}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#12353b;transform:translateY(-3px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.panel{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.panel h2{margin:0 0 6px;font-size:1.5rem}
.panel p{margin:0 0 16px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.fact{border-left:4px solid var(--accent);padding:2px 12px}
.fact b{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
input[type=search]{width:100%;font:inherit;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.results{display:grid;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto}
.res{font:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.res{display:flex;align-items:center;gap:12px}.res small{color:var(--muted);margin-left:8px}.av{width:48px;height:48px;flex:none}.avl{width:130px;height:130px;display:block;margin:0 0 8px}
.none{color:var(--muted);margin:12px 0 0}
.back{font:inherit;cursor:pointer;background:none;border:0;color:var(--teal);padding:0;margin-bottom:12px;font-weight:600}
.article h3{margin:20px 0 4px;font-size:1.05rem;color:var(--teal)}
.article p{margin:0;color:var(--ink)}
a.opt{text-decoration:none}.opt.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px}.opt.wide .e{display:inline;font-size:2.2rem}.opt.wide b{display:inline}.big{display:block;width:100%;font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#12353b;margin:0 0 12px}.panel .st{color:var(--muted);font-size:.92rem;margin:0 0 14px}.mlink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}.mlink small{display:block;color:var(--muted)}a:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.pimg,.pph{width:72px;height:72px;border-radius:16px;flex:none;object-fit:cover;background:var(--line)}.pph{display:flex;align-items:center;justify-content:center;font-size:2.2rem}.badge{font-size:.7rem;background:var(--accent);color:#12353b;border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.chips{display:flex;gap:8px;margin:0 0 14px}.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 16px}.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#12353b}.cards{display:grid;gap:12px}.gi{width:64px;height:64px;flex:none}.gc{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--bg)}.gc h3{margin:0;font-size:1.05rem}.gc .tag{margin:2px 0 6px;font-size:.85rem;color:var(--muted)}.gc p{margin:0 0 6px;color:var(--ink)}.gc .w{font-size:.9rem;color:var(--muted)}
.note{background:var(--warn);color:var(--warnink);border-radius:14px;padding:12px 16px;font-size:.92rem;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 cat:{n:"Cat",d:"Independent but affectionate. Search your cat’s breed to read its profile.",life:"12–18 years",time:"30–60 min a day",cost:"Medium",ph:"Search cat breed, e.g. Ragdoll or 布偶"},
 dog:{n:"Dog",d:"Energetic and social. Search your dog’s breed to read its profile.",life:"10–15 years",time:"1–2 hours a day",cost:"Higher",ph:"Search dog breed, e.g. Corgi or 柯基"}

var breeds={
cat:[
["Persian","波斯猫","Medium, 3.5–5.5 kg","12–17 years","Calm, gentle and quiet. Enjoys lounging and prefers a peaceful home over a busy one.","Low energy. Short, gentle play sessions each day are enough.","Long coat mats quickly: brush daily, wipe tear stains and bathe regularly.","Measure portions to avoid weight gain. Shallow bowls suit flat faces.","Flat face can cause breathing and eye problems. Prone to polycystic kidney disease (PKD) and dental crowding."],
["Siamese","暹罗猫","Medium, 3–5 kg","12–20 years","Very vocal, social and clever. Bonds closely with its people and dislikes being left alone for long.","High. Needs daily interactive play and puzzle toys.","Short coat. Weekly brushing is enough.","Slim and active. Feed a balanced high-protein diet and watch portions.","Dental disease, asthma-like airway problems, and some lines carry progressive retinal atrophy (PRA)."],
["Maine Coon","缅因猫","Large, 4.5–8 kg","12–15 years","Gentle giant. Friendly, playful and often follows its owner around like a dog.","Moderate. Provide sturdy, tall climbing trees and regular play.","Thick coat: brush 2–3 times a week and check for mats.","Grows slowly until 3–5 years old. Use a quality diet and controlled portions.","Hypertrophic cardiomyopathy (HCM), hip dysplasia and spinal muscular atrophy. Ask about health screening."],
["British Shorthair","英国短毛猫","Medium–large, 4–8 kg","12–17 years","Easygoing and calm. Affectionate without being clingy, and copes with alone time fairly well.","Moderate. Tends to be lazy, so encourage play.","Dense short coat: brush weekly, more often when shedding.","Prone to obesity. Measure every meal.","HCM, obesity and, in some lines, PKD."],
["Ragdoll","布偶猫","Large, 4.5–9 kg","12–17 years","Docile and affectionate. Often goes limp when held and follows its owner. Best kept indoors.","Gentle play and a cat tree.","Semi-long silky coat: brush 2–3 times a week.","Large and slow to mature. Feed a balanced diet and prevent obesity.","HCM and bladder stones are the main concerns."],
["Bengal","孟加拉猫","Medium–large, 3.5–7 kg","12–16 years","Energetic, athletic and curious. Loves climbing and sometimes water. Gets bored easily.","High. Needs an hour or more of interactive play and plenty of climbing space.","Short coat: weekly brushing.","High-protein diet to match its activity level.","HCM and PRA. A bored Bengal can become destructive."],
["Scottish Fold","苏格兰折耳猫","Medium, 2.7–6 kg","11–14 years","Sweet, quiet and adaptable. Enjoys company and gentle play.","Moderate play and a few climbing spots.","Weekly brushing. Check and clean the ears gently.","Normal balanced diet. Keep weight healthy to protect joints.","The folded-ear gene is linked to painful bone and joint disease (osteochondrodysplasia). Many vets and welfare groups discourage breeding it. Talk to a vet early."],
["Sphynx","斯芬克斯猫","Medium, 3.5–7 kg","8–14 years","Outgoing, attention-seeking and clownish. Loves warmth and cuddles.","High. Likes playing and climbing.","No fur, so skin oil builds up: bathe about weekly, clean ears often and keep it warm and out of strong sun.","High metabolism, so it eats more than most cats.","HCM, skin problems and dental disease."],
["Russian Blue","俄罗斯蓝猫","Medium, 3–5.5 kg","15–20 years","Quiet, loyal and gentle. Shy with strangers and sensitive to change.","Moderate. Enjoys chasing toys.","Dense double coat: brush weekly.","Likes to overeat, so measure portions.","Generally healthy. Watch weight and bladder stones."],
["Abyssinian","阿比西尼亚猫","Medium, 3–5 kg","12–15 years","Active, curious and social. A natural climber that wants to be involved in everything.","High. Needs climbing space and daily play.","Short ticked coat: minimal brushing.","Balanced diet matched to its high activity.","PRA, pyruvate kinase deficiency, kidney amyloidosis and gum disease."]
],
dog:[
["Labrador Retriever","拉布拉多","Large, 25–36 kg","10–12 years","Friendly, outgoing and eager to please. Great with families and children.","1–2 hours a day. Loves fetch and swimming.","Short double coat: brush weekly. Sheds a lot.","Very food-driven and prone to obesity. Measure meals and avoid free feeding.","Hip and elbow dysplasia, obesity, ear infections and exercise-induced collapse."],
["Golden Retriever","金毛","Large, 25–34 kg","10–12 years","Gentle, patient and intelligent. Very friendly, so it makes a poor guard dog.","1–2 hours a day plus mental play.","Feathered coat: brush several times a week. Sheds year-round.","Measure portions to prevent weight gain.","Hip and elbow dysplasia, certain cancers, heart conditions and ear infections."],
["German Shepherd","德国牧羊犬","Large, 22–40 kg","9–13 years","Loyal, confident and highly trainable. Protective, so it needs early socialisation and a job to do.","About 2 hours a day including training and mental tasks.","Double coat: brush a few times a week, daily during heavy seasonal shedding.","Large-breed diet. Avoid hard exercise right after meals because of bloat risk.","Hip and elbow dysplasia, degenerative myelopathy and bloat."],
["French Bulldog","法国斗牛犬","Small, 8–14 kg","10–12 years","Playful, affectionate and clownish, with a stubborn streak.","Short, easy walks. Avoid heat and hard exercise.","Wipe facial folds daily and brush weekly.","Prone to weight gain and gas. Measure meals.","Flat-face (brachycephalic) breathing problems, overheating, spinal issues and skin-fold infections. Many cannot mate or give birth naturally."],
["Poodle","贵宾 / 泰迪","Toy to standard, 3–32 kg","12–15 years","Very intelligent, active and trainable. Sensitive and thrives on attention.","30 minutes (toy) to 1 hour or more (standard), plus mental games.","Sheds little but mats: brush every day or two and trim every 4–8 weeks.","Feed according to size. Toy types need small meals and dental care.","Dental disease, patellar luxation, PRA, Addison’s disease, and hip dysplasia in standards."],
["Corgi","柯基","Small–medium, 10–14 kg","12–14 years","Bold, smart and affectionate. Has a herding instinct, so it may bark or nip at heels.","About 1 hour a day. Avoid jumping from heights.","Sheds heavily: brush several times a week.","Prone to obesity, which strains the back.","Intervertebral disc disease, hip dysplasia and degenerative myelopathy."],
["Border Collie","边境牧羊犬","Medium, 14–20 kg","12–15 years","Extremely intelligent and driven. Needs a job and is not suited to sedentary homes.","2 hours or more plus daily mental tasks.","Brush about twice a week.","Feed to match a very active lifestyle.","Hip dysplasia, collie eye anomaly and epilepsy."],
["Shiba Inu","柴犬","Small–medium, 8–11 kg","12–15 years","Independent, alert and proud. Cat-like and stubborn but loyal. Strong prey drive.","About 1 hour on a lead. Recall is often unreliable.","Heavy shedding twice a year: brush weekly, daily during shedding.","Measure meals to avoid weight gain.","Allergies, patellar luxation, glaucoma and hip dysplasia."],
["Siberian Husky","哈士奇","Medium–large, 16–27 kg","12–14 years","Friendly, mischievous and vocal. A clever escape artist that dislikes being left alone.","2 hours or more of running or pulling activity.","Heavy shedding: brush several times a week. Do not shave.","Efficient metabolism, so avoid overfeeding.","Eye conditions (cataracts, PRA) and hip dysplasia. Struggles in hot climates."],
["Pomeranian","博美","Toy, 2–3.5 kg","12–16 years","Lively, bold and curious. Often barks a lot.","About 30 minutes of short walks and play.","Double coat: brush several times a week. Do not shave.","Small, measured meals. Brush teeth often.","Patellar luxation, tracheal collapse, dental disease and low blood sugar in puppies. Use a harness, not a collar."],
["Chihuahua","吉娃娃","Toy, 1.5–3 kg","14–16 years","Loyal and sassy. Often bonds to one person and can be wary of strangers and small children.","Short walks and indoor play.","Short coat: weekly brushing. Long coat needs more.","Small, frequent meals to avoid low blood sugar.","Dental disease, patellar luxation and heart disease. Fragile, so handle with care."],
["Beagle","比格","Small–medium, 9–11 kg","12–15 years","Friendly, merry and curious. Follows its nose and may howl. Gets along well with others.","About 1 hour a day. Keep on a lead and use secure fencing.","Weekly brushing. Clean the ears regularly.","Obsessed with food and prone to obesity. Secure the bin and measure meals.","Ear infections, epilepsy, hypothyroidism and disc disease."]
]};
var BG='<circle cx="50" cy="50" r="50" style="fill:var(--line)"/>',PK='#f2a7b0';
function poly(s,f,sc){var a=s.split(" ").map(function(p){return p.split(",").map(Number)}),cx=0,cy=0;a.forEach(function(p){cx+=p[0];cy+=p[1]});cx/=a.length;cy/=a.length;var t=sc?' transform="translate('+cx+' '+cy+') scale('+sc+') translate('+(-cx)+' '+(-cy)+')"':'';return '<polygon points="'+s+'" fill="'+f+'"'+t+'/>'}
function mir(s){return s.split(" ").map(function(p){var a=p.split(",");return (100-a[0])+","+a[1]}).join(" ")}

function ci(cx,cy,r,f){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+f+'"/>'}
function ln(d,c,w,op){return '<path d="'+d+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" fill="none"'+(op?' opacity="'+op+'"':'')+'/>'}

 [36,64].forEach(function(px){x+=ci(px,ey,5.5,o.ey)+el(px,ey,1.8,4,'#1b1b1b')+ci(px-1.6,ey-2,1.2,'#fff')});
 x+=poly("46,63 54,63 50,68",'#e58a97')+ln('M50 68Q46 73 42 70M50 68Q54 73 58 70','#4a3030',1.3);
 if(!o.nw)x+=ln('M8 62L28 64M8 70L28 68M92 62L72 64M92 70L72 68','#5b5b5b',1,.5);
 return x}

 var x=BG,c=o.c,m=o.m,ec=o.ec||c,w=o.w||1,fl=o.fl;
 if(o.ruff)[[22,64],[34,80],[50,86],[66,80],[78,64]].forEach(function(p){x+=ci(p[0],p[1],11,c)});

 if(o.ear=="c")[[20,50,12],[17,64,11],[22,38,8],[80,50,12],[83,64,11],[78,38,8],[50,18,12],[38,22,9],[62,22,9]].forEach(function(p){x+=ci(p[0],p[1],p[2],c)});

function list(v){

  });

med:{n:"Pet Medicine",d:"Common medicines and health products. Prescription-only items must come from a vet.",note:'<div class="note"><b>For reference only.</b> Never give your pet human medicine or change a dose yourself. Doses depend on species, weight and health, and some products that are safe for dogs are dangerous for cats. Ask a vet or pharmacist before using any product. Brand names are examples, not recommendations, and availability varies by country.</div>',items:[
["Spot-on flea treatment","both","Parasite control · vet or pharmacy","Liquid applied to the skin between the shoulder blades. Kills fleas, and some products also deal with ticks, for about a month. Examples: Frontline, Advantage.","Use a product made for the right species. Dog products containing permethrin are highly toxic to cats."],
["Flea and tick chews or tablets","dog","Parasite control · vet supplied","Tasty chews that protect for one to three months depending on the product. Examples: NexGard, Bravecto, Simparica.","Dosed by weight. Tell the vet if your dog has ever had seizures."],
["Worming treatment","both","Parasite control · vet or pharmacy","Tablets or spot-ons that remove roundworms and tapeworms. Usually given every one to three months. Examples: Drontal, Milbemax.","Choose by weight and species. Dogs may also need separate lungworm prevention."],
["Vaccinations","both","Prevention · given by a vet","Dogs are usually protected against distemper, parvovirus, adenovirus and leptospirosis. Cats against cat flu, feline panleukopenia and, for many, feline leukaemia.","Start in puppyhood or kittenhood and keep boosters up to date."],
["Anti-inflammatory pain relief","both","Pain · prescription only","Reduces pain and swelling from arthritis or after surgery. A common active ingredient is meloxicam (Metacam).","Never use human painkillers: paracetamol is toxic to cats, and ibuprofen is toxic to both dogs and cats."],
["Antibiotics","both","Infection · prescription only","Treat bacterial infections of the skin, ears, teeth, bladder and more.","Give the full course as directed. Never use leftovers or another pet’s course."],
["Allergy and itch medicine","dog","Skin · prescription only","Controls itching from allergies. Examples: Apoquel tablets and Cytopoint injections.","Find the cause of the itch with a vet first, since fleas and infections look similar."],
["Probiotic gut paste","both","Digestion · over the counter","Supports the gut after a mild tummy upset or a course of antibiotics. Example: Pro-Kolin.","See a vet if there is blood, repeated vomiting or diarrhoea lasting more than a day or two."],
["Joint supplements","both","Joints · over the counter","Glucosamine, chondroitin or green-lipped mussel to support stiff joints in older or large pets. Example: Yumove.","A supplement is not a painkiller. Ask a vet if your pet limps or struggles to move."],
["Ear cleaner","both","Ears · over the counter","A gentle liquid that loosens wax and debris for routine cleaning.","Do not use on a painful, red or smelly ear. That needs a vet."],
["Dental care","both","Teeth · over the counter","Pet toothpaste, brushes, water additives and dental chews that reduce plaque.","Never use human toothpaste. Xylitol and fluoride are harmful to pets."],
["Hairball paste","cat","Digestion · over the counter","A malt-flavoured gel that helps swallowed hair pass through. Useful for long-haired cats.","Frequent coughing or retching can point to another problem, so check with a vet."]
]},
toy:{n:"Pet Toys",d:"Popular toys, what they are for and how to use them safely.",note:'<div class="note"><b>For reference only.</b> Supervise play, choose a size and toughness that suits your pet, and throw away toys that are broken or fraying. If your pet swallows part of a toy, contact a vet straight away.</div>',items:[

function ico(n){return '<svg class="gi" viewBox="0 0 100 100" aria-hidden="true">'+BG+(IC[n]||"")+'</svg>'}
function guide(k){
  var g=GU[k];
  btns.forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k===k?"true":"false")});
  panel.hidden=false;
  panel.innerHTML="<h2>"+g.n+"</h2><p>"+g.d+"</p>"+'<div class="chips"><button class="chip" data-f="all" aria-pressed="true">All</button><button class="chip" data-f="cat" aria-pressed="false">Cat</button><button class="chip" data-f="dog" aria-pressed="false">Dog</button></div><div class="cards" id="cards"></div>'+g.note;
  var chips=panel.querySelectorAll(".chip");
  chips.forEach(function(c){c.onclick=function(){chips.forEach(function(x){x.setAttribute("aria-pressed",x===c?"true":"false")});cards(k,c.dataset.f)}});
  cards(k,"all");
}
function cards(k,f){
  var lab={cat:"Cat",dog:"Dog",both:"Cat and dog"},out="";
  GU[k].items.forEach(function(it){
    if(f==="all"||it[1]===f||it[1]==="both")
      out+='<div class="gc">'+ico(it[0])+'<div><h3>'+it[0]+'</h3><div class="tag">'+lab[it[1]]+" · "+it[2]+"</div><p>"+it[3]+'</p><div class="w">'+it[4]+"</div></div></div>";
  });
  document.getElementById("cards").innerHTML=out;
}
function mapUrls(la,lo){
  var n=la===null;
  return [["Google Maps","Nearby vet clinics",n?"https://www.google.com/maps/search/?api=1&query=veterinary+clinic+near+me":"https://www.google.com/maps/search/veterinary+clinic/@"+la+","+lo+",14z"],["Google Maps","24-hour emergency vets",n?"https://www.google.com/maps/search/?api=1&query=24+hour+emergency+vet+near+me":"https://www.google.com/maps/search/24+hour+emergency+vet/@"+la+","+lo+",13z"],["Apple Maps","Nearby vet clinics",n?"https://maps.apple.com/?q=veterinary%20clinic":"https://maps.apple.com/?q=veterinary%20clinic&ll="+la+","+lo]];
}
function mapView(){
  btns.forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k==="map"?"true":"false")});
  panel.hidden=false;
  panel.innerHTML='<h2>Find a vet near you</h2><p>Use your phone’s location to open a map of the closest vet clinics.</p><button class="big" id="loc">Use my location</button><p class="st" id="st">Tap the button above, or open a map directly below.</p><div id="ml"></div><div class="note"><b>Please check before you go.</b> This page does not list clinics itself. It opens your map app, so distance, opening hours and ratings come from the map service. In an emergency, phone the clinic first. Your location stays on your device until you open a map link.</div>';
  var st=document.getElementById("st"),ml=document.getElementById("ml");
  function links(la,lo){ml.innerHTML=mapUrls(la,lo).map(function(u){return '<a class="mlink" href="'+u[2]+'" target="_blank" rel="noopener"><span>🗺️</span><span><b>'+u[0]+'</b><small>'+u[1]+'</small></span></a>'}).join("")}
  links(null,null);
  document.getElementById("loc").onclick=function(){
    if(!navigator.geolocation){st.textContent="Location is not available here. The links below still search near you in your map app.";return}
    st.textContent="Finding your location…";
    navigator.geolocation.getCurrentPosition(function(p){links(p.coords.latitude.toFixed(4),p.coords.longitude.toFixed(4));st.textContent="Location found. Open a map below to see vets near you."},function(){st.textContent="Could not get your location. Allow location access for this page, or use the links below, which search near you in your map app."},{timeout:10000,maximumAge:60000});
  };
}
btns.forEach(function(b){b.onclick=function(){var k=b.dataset.k;if(k==="map")mapView();else if(GU[k])guide(k);else show(k)}});
